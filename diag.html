<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Arbeitszeit — PWA-Diagnose</title>
  <link rel="stylesheet" href="diag.css" />
</head>
<body>
  <h1>PWA-Diagnose — Arbeitszeit</h1>

  <div class="card">
    <div class="big" id="mode-line">Modus wird ermittelt…</div>
    <div id="mode-detail" class="detail"></div>
  </div>

  <h2>Geräte-Metriken</h2>
  <table id="metrics"></table>

  <h2>Startup-Images (nur diese matchen aktuell)</h2>
  <table id="startup">
    <thead><tr><th>Datei</th><th>Media-Query</th><th>Status</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Manifest</h2>
  <div id="manifest-out" class="muted-out">wird geladen…</div>

  <h2>Service Worker</h2>
  <div id="sw-out" class="muted-out">wird geprüft…</div>

  <button id="btn-reload" type="button">Neu prüfen</button>
  <p class="back">
    <a href="./">← Zurück zur App</a>
  </p>

  <script src="diag.js"></script>
</body>
</html>
